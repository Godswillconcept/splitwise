services:
  # Web Service
  - type: web
    name: property-listing-api
    env: node
    plan: free
    buildCommand: npm install && npx sequelize-cli db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    autoDeploy: true

  # PostgreSQL Database (Free tier available)
  - type: pserv
    name: property-listing-db
    env: postgres
    plan: free
    ipAllowList: []
